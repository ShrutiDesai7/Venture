<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">
                <h1 style="padding-left: 30px; color:black ;font-size:38px;">EduVurse</h1>
            </div>
            <ul class="nav-links" style="padding-right: 40px; font-size: 20px;">
                <li><a href="index.html">Home</a></li>
                <li><a href="application.html">Application</a></li>
                <li><a href="cource_page.html">Courses</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="account.html">Account</a></li>
                <li><a href="#signin" class="signin">Sign In</a></li>
            </ul>
        </nav>
    </header>

    <div class="container">
        <h1 style="text-align: center;">Contact Us</h1>
        <div class="contact-form">
            <form>
                <input type="text" name="name" placeholder="Your Name" required>
                <input type="email" name="email" placeholder="Your Email" required>
                <textarea name="message" rows="5" placeholder="Your Message" required></textarea>
                <button type="submit">Send Message</button>
            </form>
        </div>
        <div class="contact-info">
            <p>Email: support@eduvurse.com</p>
            <p>Phone: +1 234 567 890</p>
            <p>Address: 123 EduVurse St, Learning City</p>
        </div>
    </div>
</body>
</html>
